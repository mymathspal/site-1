        <div class="form-n-socials">

        <section class="contact-form">
        <form action="" class="enquiry-form">
                <label for="fullName">Full Name * <span class="err-msg name-err"></span></label>
                <input type="text" name="full-name" id="fullName" placeholder="John Doe" required>

                <label for="email">Email * <span class="err-msg email-err"></span></label>
                <input type="email" name="email" id="email" placeholder="example@gmail.com" required>

                <label for="telNum">Telephone Number * <span class="err-msg tel-err"></span></label> 
                <input type="tel" name="telNum" id="telNum" required>

                <label for="message">Message * <span class="err-msg message-err"></span></label>
                <textarea name="message" id="message" cols="30" rows="10" placeholder="Tell us more about the job ..." required></textarea>

                <button type="submit" class="submit-btn" id="submit-btn">Send Enquiry</button>

            </form>
        </section>
